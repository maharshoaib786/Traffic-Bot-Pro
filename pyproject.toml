[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-bot-pro"
version = "0.1.0"
description = "Programmable traffic generation and analytics toolkit inspired by Traffic Bot Pro"
authors = [{name = "AutoGenerated"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "aiohttp>=3.8",
    "PyYAML>=6.0",
]

[project.scripts]
trafficbot = "trafficbot.cli:main"
