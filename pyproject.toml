[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-bot-pro"
version = "1.0.0"
description = "Programmable traffic generation and analytics toolkit inspired by Traffic Bot Pro"
authors = [{name = "AutoGenerated"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "aiohttp>=3.8",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/example/traffic-bot-pro"
Documentation = "https://github.com/example/traffic-bot-pro#readme"
Source = "https://github.com/example/traffic-bot-pro"
Issues = "https://github.com/example/traffic-bot-pro/issues"

[project.scripts]
trafficbot = "trafficbot.cli:main"
